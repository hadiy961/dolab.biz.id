server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    # Asset Vite sudah ber-hash di nama file, jadi aman di-cache selamanya.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html jangan pernah di-cache: dia yang nunjuk ke hash asset baru.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aplikasi satu halaman tanpa client-side router, jadi tidak perlu
    # fallback SPA ke index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
